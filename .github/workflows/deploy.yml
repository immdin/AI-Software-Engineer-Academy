name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # На Шаге 0 файла package-lock.json ещё нет, поэтому npm install.
      # Когда lock-файл появится в репозитории, заменим на `npm ci` (строго по lock-файлу).
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Приложение живёт по адресу https://<логин>.github.io/<репозиторий>/
          VITE_BASE: /${{ github.event.repository.name }}/

      # Проверяет файлы сборки: пути с именем репозитория, значки, манифест и список файлов
      # для офлайна в sw.js. Если что-то не так, публикации не будет.
      - name: Verify build output
        run: node scripts/verify-build.mjs dist /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
